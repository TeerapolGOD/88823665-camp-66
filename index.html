<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two-column Form Layout</title>
    <link rel="stylesheet" href="mystyle.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    
</head>
<body>
    <div class="container mt-5">
        <form class="mx-auto" style="max-width: 1500px;">
            <!-- ชื่อ -->
            <div class="row mb-3">
                <label for="fname" class="col-sm-3 col-form-label">ชื่อ</label>
                <div class="col-sm-9">
                    <input type="text" id="fname" name="fname" class="form-control">
                </div>
            </div>

            <!-- สกุล -->
            <div class="row mb-3">
                <label for="lname" class="col-sm-3 col-form-label">สกุล</label>
                <div class="col-sm-9">
                    <input type="text" id="lname" name="lname" class="form-control">
                </div>
            </div>

            <!-- วัน/เดือน/ปีเกิด -->
            <div class="row mb-3">
                <label for="dob" class="col-sm-3 col-form-label">วัน/เดือน/ปีเกิด</label>
                <div class="col-sm-9">
                    <input type="date" id="dob" name="dob" class="form-control">
                </div>
            </div>

            <!-- อายุ -->
            <div class="row mb-3">
                <label for="age" class="col-sm-3 col-form-label">อายุ</label>
                <div class="col-sm-9">
                    <input type="number" id="age" name="age" class="form-control">
                </div>
            </div>

            <!-- เพศ -->
            <div class="row mb-3">
                <label class="col-sm-3 col-form-label">เพศ</label>
                <div class="col-sm-9">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" id="male" name="gender" value="ชาย">
                        <label class="form-check-label" for="male">ชาย</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" id="female" name="gender" value="หญิง">
                        <label class="form-check-label" for="female">หญิง</label>
                    </div>
                </div>
            </div>

            <!-- รูป -->
            <div class="row mb-3">
                <label for="file" class="col-sm-3 col-form-label">รูป</label>
                <div class="col-sm-9">
                    <input type="file" id="file" name="file" class="form-control">
                </div>
            </div>

            <!-- ที่อยู่ -->
            <div class="row mb-3">
                <label for="address" class="col-sm-3 col-form-label">ที่อยู่</label>
                <div class="col-sm-9">
                    <textarea id="address" name="address" rows="3" class="form-control"></textarea>
                </div>
            </div>

            <!-- สีที่ชอบ -->
            <div class="row mb-3">
                <label for="color" class="col-sm-3 col-form-label">สีที่ชอบ</label>
                <div class="col-sm-9">
                    <select id="color" name="color" class="form-select">
                        <option value="red">สีแดง</option>
                        <option value="blue">สีน้ำเงิน</option>
                        <option value="green">สีเขียว</option>
                    </select>
                </div>
            </div>

            <!-- แนวเพลงที่ชอบ -->
            <div class="row mb-3">
                <label class="col-sm-3 col-form-label">แนวเพลงที่ชอบ</label>
                <div class="col-sm-9">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" id="life" name="music" value="เพื่อชีวิต">
                        <label class="form-check-label" for="life">เพื่อชีวิต</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" id="rock" name="music" value="ลูกทุ่ง">
                        <label class="form-check-label" for="rock">ลูกทุ่ง</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" id="other" name="music" value="อื่นๆ">
                        <label class="form-check-label" for="other">อื่นๆ</label>
                    </div>
                </div>
            </div>

            <!-- ยินยอมให้เก็บข้อมูล -->
            <div class="row mb-3">
                <div class="col-sm-3">
                    <div class="form-check">
                        <input type="checkbox" id="agree" name="agree" class="form-check-input">
                        <label for="agree" class="form-check-label">ยินยอมให้เก็บข้อมูล</label>
                    </div>
                </div>
            </div>

            <!-- ปุ่ม Reset และ Submit -->
            <div class="row mb-3">
                <div class="col-sm-12 d-flex justify-content-between">
                    <button type="reset" class="btn btn-secondary">Reset</button>
                    <button type="submit" class="btn btn-primary">Submit</button>
                </div>
            </div>
            
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
